name: FlowReviewApp
options:
  bundleIdPrefix: com.flowreview
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: false
    DEVELOPMENT_TEAM: ""
targets:
  FlowReviewApp:
    type: application
    platform: macOS
    sources:
      - path: AppIcons/FlowReviewApp/Assets.xcassets
        buildPhase: resources
      - path: Sources/FlowReviewApp
    info:
      path: Sources/FlowReviewApp/Info.plist
      properties:
        CFBundleName: Flow Review
        CFBundleDisplayName: Flow Review
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
        NSPrincipalClass: NSApplication
        LSUIElement: false
        NSMainStoryboardFile: ""
        ITSAppUsesNonExemptEncryption: false
        NSQuitAlwaysKeepsWindows: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowreview.FlowReviewApp
        PRODUCT_NAME: "Flow Review"
        PRODUCT_MODULE_NAME: FlowReviewApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
  FlowReviewAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/FlowReviewAppTests
    dependencies:
      - target: FlowReviewApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Flow Review.app/Contents/MacOS/Flow Review"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  FlowReviewApp:
    build:
      targets:
        FlowReviewApp: all
        FlowReviewAppTests: [test]
    test:
      targets:
        - FlowReviewAppTests
    run:
      config: Debug
